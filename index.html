<style>
*{box-sizing:border-box}

.shell{display:block;min-height:100dvh;max-width:100%;overflow-x:hidden;background:transparent}

.shiro-svg{display:inline-block;vertical-align:middle;flex-shrink:0}

.main{max-width:1600px;width:100%;padding:calc(26px + env(safe-area-inset-top)) 18px calc(178px + env(safe-area-inset-bottom));margin:auto;overflow-x:hidden;background:transparent}
.top{position:relative;z-index:20;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px;margin-bottom:12px;padding-top:4px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;opacity:1;filter:none}
.eyebrow{display:none}
.h1{position:relative;top:0.5px;font-size:21px;font-weight:800;margin:2px 0;letter-spacing:-.02em}
.title-line{display:flex;justify-content:flex-start;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.title-controls{display:none;align-items:center;gap:4px;font-size:15px;font-weight:700;color:#000000}
.title-controls select{font:inherit;font-weight:700;color:#000000!important;border:0!important;background:transparent!important;box-shadow:none!important;padding:0 2px!important;appearance:none;-webkit-appearance:none;outline:none;cursor:pointer}

.day-summary-date-row{display:flex;flex:1 1 auto;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;min-width:0}

.day-summary-date-row select::-ms-expand{display:none}

.quick-mode-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin:4px 0 8px}
.quick-mode-btn{width:100%;height:38px;min-height:38px;max-height:38px;padding:0 10px;border-radius:999px;font-size:12.5px;line-height:1.2;font-weight:800;background:#f4f6f8;color:#5c6873;border:1.5px solid #e3e8ec;text-align:center;box-shadow:none;display:inline-flex;align-items:center;justify-content:center}

.day-quick-card{background:#ffffff;border:1.5px solid #e8efe9;border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(82,135,104,.06);width:100%;max-width:100%;min-width:0;overflow:hidden}

.day-quick-date-box{position:relative;width:100%;max-width:100%;min-width:0;height:40px;min-height:40px;max-height:40px;border:1.5px solid #e7ecef;border-radius:11px;background:#ffffff;display:flex;align-items:center;justify-content:flex-start;padding:0 11px;overflow:hidden}

.day-quick-submit{background:#fff2f3;color:#d04652;border:1.5px solid #f8c4c9;width:calc((50% - 6px) / 3);min-width:52px;height:30px;min-height:30px;max-height:30px;border-radius:999px;padding:0 8px;font-size:11px;line-height:1.2;font-weight:800;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(240,78,88,.14)}
.day-quick-submit:hover{background:#ffe5e8;border-color:#f4aeb5}
.day-today-card{background:#ffffff;border:1.5px solid #e8efe9;border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px rgba(82,135,104,.06);width:100%;max-width:100%;min-width:0;overflow:hidden}
.day-calendar-card{background:#ffffff!important;background-color:#ffffff!important;opacity:1!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1.5px solid #e8efe9;border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px rgba(82,135,104,.06);width:100%;max-width:100%;min-width:0;overflow:hidden}
.day-today-toggle{background:transparent!important;color:var(--muted)!important;padding:2px 4px!important;font-size:12px!important;font-weight:700!important;margin-left:auto;text-align:right}
.day-today-toggle:hover{color:var(--ink)!important}

.tx-date-controls{
  display:grid;

  width:100%;

  appearance:none;
  white-space:nowrap;
}
.tx-date-controls select::-ms-expand{display:none}
.tx-date-controls .period-unit{
  display:inline-block;
  text-align:center;

}
.toolbar .filter-period-unit{margin-left:-2px;margin-right:4px;color:var(--muted);font-size:11.5px;font-weight:650;white-space:nowrap}
.sub{color:var(--muted);font-size:11px}
.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:center}

.grid{display:grid;gap:12px}
.cards{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:0 4px 16px rgba(32,38,58,.04);min-width:0;max-width:100%}

.metric-label{font-size:11.5px;color:var(--muted);font-weight:650;line-height:1.3}

.positive{color:var(--green)}
.negative{color:var(--red)}

.hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hub-btn{background:#f2f3f7;color:#2a3146;font-weight:700;font-size:12.5px;padding:11px 8px;border-radius:10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-btn:hover{background:#e5e8f2;color:#1d2438}

.spending-box-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;align-items:start}

.spending-cell.clickable-cell:hover{background:#f7f8fc}
.spending-val{font-size:17px;font-weight:800;margin-top:6px;letter-spacing:-.025em;line-height:1.25;font-variant-numeric:tabular-nums;word-break:break-word}

.monthly-summary-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}
.monthly-summary-list{display:grid;gap:12px;font-size:13px;margin-top:4px}
.monthly-summary-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0}

.assets-main-split{grid-template-columns:1fr 1fr;align-items:start}
.assets-left-stack{display:grid;gap:12px;align-content:start}
.assets-fixed-scroll{max-height:380px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.yearly-summary-two{grid-template-columns:repeat(2,minmax(0,1fr))}
.yearly-split{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.yearly-side-stack{display:grid;gap:12px}
.section-title{font-size:14.5px;font-weight:800;margin:0;color:var(--ink);letter-spacing:-.015em}
.card-head-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-top-amount{font-size:15px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}

.barrow{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:8px;margin:9px 0;font-size:12px}

.amt-val{text-align:right}
.chg-pct{font-size:10px;font-weight:700;text-align:right;white-space:nowrap}
.chg-pct.empty-pct{visibility:hidden}
.track{height:9px;background:#eef0f6;border-radius:10px;overflow:hidden}
.fill{height:100%;background:var(--blue);border-radius:10px}

.sub-summary-box{background:#f8f9fd;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:14px}
.sub-summary-title{font-size:12px;font-weight:800;margin:0 0 8px;color:var(--ink)}

.kv-list{display:grid;gap:8px;font-size:12px}
.kv-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv-row:last-child{border-bottom:0}
.kv-row.click-sub{cursor:pointer;border-radius:7px;padding:7px 8px;margin:0 -8px;transition:background .12s ease}
.kv-row.click-sub:hover{background:#eef1fb}
.kv-row.click-sub.active{background:#e4e9ff;outline:1px solid #c5cffc}

.status-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:12px;margin-left:5px;vertical-align:middle}
.status-done{background:#e8f7f1;color:#16835f}
.status-upcoming{background:#eef0ff;color:#4656a8}
.status-overdue{background:#fff0f1;color:#c83f4c}
.status-inactive{background:#f0f2f8;color:#7a8299}
.fixed-modal-list{display:grid;gap:8px}
.fixed-modal-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid #eef0f6;background:#fff}

.fixed-modal-name{font-size:13.5px;font-weight:800;color:var(--ink)}
.fixed-modal-item.is-done .fixed-modal-name{color:#16835f}
.fixed-modal-sub{font-size:11px;color:var(--muted);margin-top:3px}
.fixed-modal-amt{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.fixed-modal-item.is-done .fixed-modal-amt{color:#16835f}

.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{text-align:center!important;color:var(--muted);font-weight:650;background:#fafbfe}
th,td{padding:10px 9px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;background:#f0f2f8;color:#59627a}
.tag.in{background:#e8f7f1;color:#16835f}
.tag.out{background:#fff0f1;color:#c84e59}
.tag.save{background:#eef0ff;color:#4656a8}

.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#page-ledger .toolbar{
  display:flex;
  align-items:center;
  flex-wrap:nowrap;
  gap:4px;
  width:100%;
  max-width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#page-ledger .toolbar::-webkit-scrollbar{display:none}
#page-ledger .toolbar select,

}

.field{display:grid;gap:5px;min-width:0;max-width:100%}
.field label{font-size:10px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #dfe3ed;border-radius:9px;padding:8px 9px;background:#fff;color:var(--ink);min-width:0;max-width:100%;width:100%;font-size:12px}
.field input:focus,.field select:focus{outline:2px solid #d9deff;border-color:var(--blue)}
.checkline{display:flex;align-items:center;gap:7px;padding:7px 0;font-size:12px;font-weight:600;min-width:0;max-width:100%}

.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0;max-width:100%}

.modal.show{display:flex}
.dialog{background:#fff;border-radius:15px;padding:18px;width:min(620px,100%);min-width:0;max-width:100%;max-height:calc(100dvh - 36px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;box-shadow:0 20px 70px #10182c44}

.day b{display:block;width:100%;text-align:right;font-size:12px;margin-bottom:2px}
.day .day-inc{color:var(--green);font-weight:700;font-size:10.5px;line-height:1.25;text-align:right}
.day .day-exp{color:var(--red);font-weight:700;font-size:10.5px;line-height:1.25;text-align:right}

.muted{color:var(--muted)}
.hidden{display:none!important}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:12px}
.footnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}
.setting-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sub-chip{display:inline-flex;align-items:center;gap:6px;background:#f4f5fa;border:1px solid #e2e6f0;border-radius:8px;padding:5px 9px;font-size:12px;margin:4px 6px 4px 0}
.sub-chip button{background:transparent;color:#c83f4c;padding:0 2px;font-size:13px;line-height:1}

.fab-add{
  position:fixed;
  right:18px;
  bottom:calc(64px + env(safe-area-inset-bottom));
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  font-size:26px;
  font-weight:700;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 24px rgba(86,105,223,.35);
  z-index:990;
  padding:0;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.fab-add:hover{background:#4356cc;transform:translateY(-2px)}
.fab-add.dragging{transition:none!important;cursor:grabbing;transform:scale(1.05)}

.setting-item.account-row{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(110px,auto) auto;align-items:center;gap:8px}
.acc-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-init-right{grid-column:3;text-align:right;white-space:nowrap}
.acc-actions{grid-column:4;display:flex;gap:6px}
.setting-item.card-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px}
.card-link-bank{text-align:right;white-space:nowrap;font-size:12px}
.card-actions{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:1100px){
  .yearly-split,.assets-main-split{grid-template-columns:1fr}
}
@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
  .side{padding:10px 6px calc(10px + env(safe-area-inset-bottom));min-height:60px;transform:translateY(28px)}
  .nav{gap:4px}
  .nav button{padding:7px 1px 5px;font-size:9.8px;min-height:42px;border-radius:7px;letter-spacing:-.02em;gap:6px}
  .nav button>span:last-child{letter-spacing:0.04em}
  .nav-emoji{font-size:15px}
  .main{padding:calc(22px + env(safe-area-inset-top)) 12px calc(168px + env(safe-area-inset-bottom))}
  .top{gap:6px;margin-bottom:10px}
  .h1{position:relative;top:0.5px;font-size:19px}
  .title-controls{font-size:14px}
  .title-controls select{min-height:28px;padding:2px 4px!important}
  .tx-date-controls select{min-height:36px}
  .day-summary-date-row select{padding:4px 4px;font-size:11.5px}
  .day-quick-card{padding:14px 12px}
  .day-quick-formgrid{column-gap:8px;row-gap:10px}
  .day-quick-input{font-size:12.5px;padding:0 9px}
  .day-quick-date-box{padding:0 9px}
  .day-quick-date-display{font-size:12.5px}
  .day-quick-submit{width:calc((50% - 4px) / 3);min-width:48px;height:30px;min-height:30px;max-height:30px;border-radius:999px;font-size:11px;padding:0 6px}
  #page-ledger .toolbar{gap:3px}
  #page-ledger .toolbar select,
  #page-ledger .toolbar input{padding:6px 4px;font-size:11px}
  #page-ledger .toolbar #filterYear{width:54px}
  #page-ledger .toolbar #filterMonth{width:36px}
  #page-ledger .toolbar #filterType{width:64px}
  #page-ledger .toolbar #search{flex:1 1 70px;min-width:68px;padding:6px 6px}
  #page-ledger .toolbar .filter-period-unit{margin-right:2px;font-size:10.5px}
  .actions{margin-left:auto;justify-content:flex-end;gap:5px;width:auto}
  .actions button{padding:6px 8px;font-size:11px}
  .card{padding:13px 14px;border-radius:13px}
  .metric{font-size:17px}
  .cards{gap:10px}
  .hub-grid{gap:8px}
  .hub-btn{padding:10px 6px;font-size:11.5px;border-radius:9px}
  .spending-box-grid{gap:14px 8px}
  .spending-val{font-size:15px}
  .monthly-summary-pair{gap:10px}
  .barrow{grid-template-columns:64px 1fr auto;gap:6px;font-size:11.5px}
  .amt-cell{grid-template-columns:auto 42px;column-gap:4px;font-size:11.5px}
  .yearly-settlement-table th,.yearly-settlement-table td{padding:8px 5px;font-size:11px}
  .yearly-settlement-table td.pad-r-indent,.yearly-settlement-table th.pad-r-indent{padding-right:6px}
  .setting-item{flex-wrap:wrap}
  .setting-item.account-row{grid-template-columns:minmax(0,1fr) auto;gap:6px}
  .acc-init-right{grid-column:2;text-align:right;font-size:11px}
  .acc-actions{grid-column:1 / -1;justify-content:flex-end}
  .setting-item.card-row{grid-template-columns:minmax(0,1fr) auto;gap:6px}
  .card-link-bank{grid-column:2;text-align:right;font-size:11px}
  .card-actions{grid-column:1 / -1;justify-content:flex-end}
  .modal{padding:12px}
  .dialog{padding:15px;border-radius:14px;max-height:calc(100dvh - 24px)}
  .dialog .field input,.dialog .field select,.dialog .field textarea{font-size:10px;padding:10px 10px}
  .tx-date-controls select{font-size:14px;padding:7px 3px}
  .formgrid,.calc-preview-grid{grid-template-columns:1fr}
  .monthgrid{gap:3px}
  .day{min-height:76px;padding:4px;font-size:9.5px}
  .day .day-inc,.day .day-exp,.day .day-card,.day .zero{font-size:9px}
  .fab-add{right:14px;bottom:calc(54px + env(safe-area-inset-bottom));width:48px;height:48px;font-size:24px}
}
@media(max-width:380px){
  .monthly-summary-pair{grid-template-columns:1fr}
  .spending-val{font-size:13.5px;letter-spacing:-.03em}
  .hub-btn{font-size:11px;padding:9px 4px}
}

th.left,td.left{text-align:left}
th.pad-l-indent,td.pad-l-indent{padding-left:18px}
th.pad-r-indent,td.pad-r-indent{padding-right:18px}

#monthlyYear,#monthlyMonth,#yearlyYear,#calYear,#calMonth,#filterYear,#filterMonth,#filterType{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;box-shadow:none;padding-left:0;padding-right:4px;
}
#filterYear,#filterMonth{padding-right:0}
#filterType{padding-left:6px}

:root{
  --bg:#f4f7f2;
  --card:#ffffff;
  --ink:#26302a;
  --muted:#77857c;
  --line:#e2ebe3;
  --blue:#ff5a5f;
  --green:#2bb673;
  --red:#f04e58;
  --amber:#f5a623;
  --shin-mint:#88d8b0;
  --shin-yellow:#ffe066;
  --shin-pink:#ff9aa2;
  --shin-lavender:#ede7f6;
}
body{
  background:
    radial-gradient(circle at 12% 18%, rgba(255,224,102,.32) 0 10px, transparent 11px),
    radial-gradient(circle at 86% 12%, rgba(136,216,176,.32) 0 12px, transparent 13px),
    radial-gradient(circle at 78% 72%, rgba(255,154,162,.25) 0 9px, transparent 10px),
    linear-gradient(180deg, #f3f9f5 0%, #f6f3fb 100%);
  background-size: 180px 180px, 220px 220px, 200px 200px, 100% 100%;
  color:var(--ink);
}
.side{
  background:linear-gradient(90deg, #6ccba1 0%, #86d7b2 50%, #6ccba1 100%);
  border-top:none;
  box-shadow:0 -6px 22px rgba(74,145,112,.18);
}
.nav button{
  color:#1f3b2e;
  font-weight:750;
  border-radius:14px;
}
.nav button.active,.nav button:hover{
  background:#fffbe6;
  color:#e04850;
  box-shadow:0 3px 10px rgba(224,72,80,.15);
}
.card{
  border:2px solid #e3efe6;
  border-radius:18px;
  box-shadow:0 6px 18px rgba(82,135,104,.07);
}
.card.clickable:hover{
  border-color:#ff8b94;
  box-shadow:0 8px 22px rgba(255,90,95,.14);
}
.hub-btn{
  background:#f4f7f5;
  color:#26302a;
  border:none;
  border-radius:13px;
}
.hub-btn:hover{
  background:#e6efe9;
  color:#ff5a5f;
}
button{
  background:#ff5a5f;
  border-radius:12px;
}
button:hover{background:#e8484d}
button.ghost{background:#eef6f0;color:#2e4a3b}
button.ghost:hover{background:#dfeee3}
.fab-add{
  background:linear-gradient(135deg, #ff5a5f, #ff8266);
  border:none;
  box-shadow:0 10px 24px rgba(255,90,95,.35);
}
.fab-add:hover{background:linear-gradient(135deg, #eb474c, #ff6f52)}
.track{background:#ebf3ed}
.fill{background:#ff5a5f}
.sub-summary-box{background:#f7fbf8;border-color:#dfece2;border-radius:14px}
.day{background:#ffffff;border-color:#e2eee5;border-radius:12px}
.day-calendar-card,.day-calendar-card .monthgrid,.day-calendar-card .day{background:#ffffff!important;background-color:#ffffff!important;opacity:1!important}
.day-calendar-card .day{background:#ffffff!important}
.day .zero{color:#2bb673}
.shin-badge{
  position:relative;
  top:1.5px;
  z-index:25;
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,224,102,0.56);
  color:#3d2c1e;font-size:11px;font-weight:800;
  padding:4px 10px;border-radius:999px;margin-top:0;margin-bottom:2px;
  transform:none;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:1;filter:none;
  box-shadow:0 2px 8px rgba(61,44,30,.08);
  border:1px solid rgba(255,214,72,0.45);
}

/* 주요 콘텐츠 영역은 기존보다 약 10% 더 비치도록 투명도를 높임 */
.card,
.day-quick-card,
.day-today-card,
.day-calendar-card,
.sub-summary-box,
.calc-preview,
.fixed-modal-item {
  background-color:rgba(255,255,255,.52) !important;
  opacity:1 !important;
  backdrop-filter:blur(1px) !important;
  -webkit-backdrop-filter:blur(1px) !important;
}

/* 모든 팝업창(.modal .dialog, .dialog)은 불투명 흰색 바탕 유지 */
.modal .dialog,
.dialog {
  background:#ffffff !important;
  background-color:#ffffff !important;
  opacity:1 !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}
.day-calendar-card .monthgrid { background:transparent !important; }
.day-calendar-card .day,
.day {
  background:rgba(255,255,255,.42) !important;
  background-color:rgba(255,255,255,.42) !important;
}

/* 일반 화면 입력칸 글자 크기 */
input,
select,
textarea,
.field input,
.field select,
.field textarea,
.tx-date-controls select,
.day-quick-input,
.day-summary-date-row select,
#page-ledger .toolbar input,
#page-ledger .toolbar select {
  font-size: 10px !important;
}

/* 팝업창(.modal, .dialog) 내부 입력칸은 모바일 확대 방지 및 가독성을 위해 16px 이상 유지 */
.modal input,
.modal select,
.modal textarea,
.dialog input,
.dialog select,
.dialog textarea,
.dialog .field input,
.dialog .field select,
.dialog .field textarea,
.dialog .tx-date-controls select,
.dialog .toolbar input,
.dialog .toolbar select {
  font-size: 16px !important;
}


/* 입력칸 선택(포커스) 시 테두리를 하단 메뉴탭(#6ccba1)과 같은 초록색으로 설정 */
input:focus,
select:focus,
textarea:focus,
.field input:focus,
.field select:focus,
.field textarea:focus,
.dialog .field input:focus,
.dialog .field select:focus,
.dialog .field textarea:focus,
.day-quick-input:focus,
.day-quick-date-box:focus-within,
.toolbar input:focus,
.toolbar select:focus {
  outline: none !important;
  border-color: #6ccba1 !important;
  box-shadow: 0 0 0 2px rgba(108, 203, 161, 0.28) !important;
}
</style>

const HOME_ICON_URL='./IMG_7769.JPEG?v=20261125';

function moonRabbitIconDataUrl(){
  return HOME_ICON_URL;
}

function applyMoonRabbitHomeIcon(){
  const iconUrl=moonRabbitIconDataUrl();
  const appleLink=$('appleTouchIcon');
  const applePrecomposed=$('appleTouchIconPrecomposed');
  const favLink=$('dynamicFavicon');
  const manifestLink=$('appManifest');
  if(appleLink){
    appleLink.setAttribute('rel','apple-touch-icon');
    appleLink.setAttribute('sizes','180x180');
    appleLink.setAttribute('href',iconUrl);
  }
  if(applePrecomposed){
    applePrecomposed.setAttribute('rel','apple-touch-icon-precomposed');
    applePrecomposed.setAttribute('sizes','180x180');
    applePrecomposed.setAttribute('href',iconUrl);
  }
  if(favLink){
    favLink.setAttribute('rel','icon');
    favLink.setAttribute('type','image/jpeg');
    favLink.setAttribute('href',iconUrl);
  }
  if(manifestLink){
    manifestLink.setAttribute('rel','manifest');
    manifestLink.setAttribute('href','./manifest.webmanifest?v=20261125');
  }
}

      if(parsed && typeof parsed==='object' && !Array.isArray(parsed)){

function normalizeTxType(rawType){
  const t=String(rawType||'').trim();
  if(t==='수입' || t==='입금')return '수입';
  if(t==='이체')return '이체';
  return '지출';
}

function normalizeDateString(val){
  if(!val)return iso(today);
  if(val instanceof Date && !isNaN(val.getTime()))return iso(val);
  const str=String(val).trim();
  const match=str.match(/^(\d{4})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/);
  if(match){
    const y=Number(match[1]),m=Number(match[2]),d=Number(match[3]);
    const check=new Date(y,m-1,d);
    if(m>=1&&m<=12&&d>=1&&check.getFullYear()===y&&check.getMonth()===m-1&&check.getDate()===d){
      return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
    return iso(today);
  }
  const dt=new Date(str);
  if(!isNaN(dt.getTime()))return iso(dt);
  return iso(today);
}

function normalizeStateData(raw){
  const mergedAccounts=Array.isArray(raw?.accounts)?[...raw.accounts]:[];
  const hasFixedKey=Array.isArray(raw?.fixedExpenses);
  const nextTransactions=Array.isArray(raw?.transactions)?raw.transactions.map((t,idx)=>({
      id:String(t.id || (Date.now() + '_' + idx)),
      date:normalizeDateString(t.date),
      amount:Math.max(0,Number(String(t.amount??0).replace(/[₩원,\s]/g,''))||0),
      type:normalizeTxType(t.type),
      account:String(t.account||mergedAccounts[0]||'').trim(),
      category:String(t.category||'').trim(),
      item:String(t.item||'').trim(),
      memo:String(t.memo||'').trim()
    })):[];

  return {
    transactions:nextTransactions,
    assets:Array.isArray(raw?.assets)?raw.assets.map(a=>({...a,name:String(a.name||'').trim(),org:String(a.org||'').trim(),amount:Number(a.amount)||0})).filter(a=>a.name):[],
    debts:Array.isArray(raw?.debts)?raw.debts.map(d=>({...d,name:String(d.name||'').trim(),org:String(d.org||'').trim(),amount:Number(d.amount)||0,monthlyPayment:Number(d.monthlyPayment)||0,maturityDate:normalizeDateString(d.maturityDate)})).filter(d=>d.name):[],
    emergency:Array.isArray(raw?.emergency)?raw.emergency.map((e,idx)=>({id:String(e.id||('em_'+idx)),date:normalizeDateString(e.date),kind:e.kind==='출금'?'출금':'입금',amount:Number(e.amount)||0,memo:String(e.memo||'').trim()})).filter(e=>e.amount!==0):[],
    savings:Array.isArray(raw?.savings)?raw.savings.map((s,idx)=>({
      id:String(s.id||('sv_'+idx)),
      name:String(s.name||'').trim(),
      monthly:Math.max(0,Number(s.monthly)||0),
      startDate:normalizeDateString(s.startDate),
      maturityDate:normalizeDateString(s.maturityDate),
      termMonths:Math.max(1,Number(s.termMonths)||12),
      rate:Math.max(0,Number(s.rate)||0),
      taxType:String(s.taxType||'일반과세').trim(),
      method:String(s.method||'정액적립식').trim()
    })).filter(s=>s.name):[],
    income:Array.isArray(raw?.income)?[...raw.income]:[],
    expense:Array.isArray(raw?.expense)?[...raw.expense]:[],
    accounts:mergedAccounts,
    accountInitials:raw?.accountInitials?{...raw.accountInitials}:{},
    cardBankLinks:raw?.cardBankLinks?{...raw.cardBankLinks}:{},
    categoryItems:raw?.categoryItems?{...raw.categoryItems}:{},
    fixedExpenses:hasFixedKey?raw.fixedExpenses.map((r,idx)=>({
      id:String(r.id||('fx_'+idx)),
      name:String(r.name||'').trim(),
      amount:Math.max(0,Number(r.amount)||0),
      day:Math.min(Math.max(Number(r.day)||1,1),31),
      category:String(r.category||'기타비').trim(),
      active:r.active!==false
    })).filter(r=>r.name):[],
    budget:Number.isFinite(Number(raw?.budget))?Number(raw.budget):0,
    year:Number(raw?.year)||CURRENT_YEAR,
    dayQuickDraft:{
      type:normalizeTxType(raw?.dayQuickDraft?.type||'지출'),
      date:raw?.dayQuickDraft?.date?normalizeDateString(raw.dayQuickDraft.date):'',
      account:String(raw?.dayQuickDraft?.account||'').trim(),
      category:String(raw?.dayQuickDraft?.category||'').trim(),
      item:String(raw?.dayQuickDraft?.item||'').trim(),
      amount:String(raw?.dayQuickDraft?.amount??'').trim(),
      memo:String(raw?.dayQuickDraft?.memo||'').trim()
    }
  };
}

function formatTimeOnly(d=new Date()){
  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
}

function updateRestoreSnapshotBtn(){

  if(!btn)return;
  try{
    const snap=localStorage.getItem('money2027_v2_pre_import');
    btn.classList.toggle('hidden',!snap);
  }catch(_e){
    btn.classList.add('hidden');
  }
}

function saveSnapshotBeforeImport(){
  try{
    localStorage.removeItem('money2027_v2_previous');
    const current=localStorage.getItem('money2027_v2');
    if(current && current.length<=1800000){
      localStorage.setItem('money2027_v2_pre_import',current);
    }else{
      localStorage.removeItem('money2027_v2_pre_import');
    }
    updateRestoreSnapshotBtn();
  }catch(_e){
    try{
      localStorage.removeItem('money2027_v2_previous');
      localStorage.removeItem('money2027_v2_pre_import');
    }catch(_cleanErr){}
    updateRestoreSnapshotBtn();
  }
}

function restorePreImportSnapshot(){
  try{
    const snap=localStorage.getItem('money2027_v2_pre_import');
    if(!snap){
      alert('복구할 직전 불러오기 스냅샷이 없습니다.');
      updateRestoreSnapshotBtn();
      return;
    }
    if(!confirm('파일을 불러오기 직전의 데이터 상태로 되돌릴까요?'))return;
    state=normalizeStateData(JSON.parse(snap));
    save();
    render();
    alert(`직전 스냅샷으로 복구했습니다. (거래 ${state.transactions.length}건)`);
  }catch(err){
    alert('스냅샷 복구 중 오류가 발생했습니다: '+err.message);
  }
}

function save(){
  const payload=JSON.stringify(state);
  try{
    if(payload.length<=1500000){
      const previous=localStorage.getItem('money2027_v2');
      if(previous && previous!==payload && previous.length<=1500000){
        try{ localStorage.setItem('money2027_v2_previous',previous); }catch(_prevErr){}
      }
    }else{
      try{ localStorage.removeItem('money2027_v2_previous'); }catch(_rmErr){}
    }
    localStorage.setItem('money2027_v2',payload);
    updateSaveStatusLabel(`자동저장 중 ${formatTimeOnly()}`);
    return true;
  }catch(e){
    try{
      localStorage.removeItem('money2027_v2_previous');
      localStorage.removeItem('money2027_v2_pre_import');
      localStorage.setItem('money2027_v2',payload);
      updateSaveStatusLabel(`자동저장 중 ${formatTimeOnly()} (스냅샷 정리됨)`);
      updateRestoreSnapshotBtn();
      return true;
    }catch(retryErr){
      updateSaveStatusLabel('저장 실패: 저장공간 부족');
      alert('브라우저 저장공간이 부족하여 데이터를 저장하지 못했습니다. 불필요한 내역을 정리하거나 JSON 백업으로 보관해 주세요.');
      console.error('머니플래너 자동 저장 실패',retryErr);
      return false;
    }
  }
}

function years(){
  const txYears=state.transactions.map(t=>Number(String(t.date||'').slice(0,4))).filter(n=>Number.isFinite(n)&&n>1900);
  return [...new Set([CURRENT_YEAR,...txYears])].sort((a,b)=>b-a);
}
function fillSelect(id,items,selected){
  const el=$(id);
  if(!el)return;
  const isYear=id.toLowerCase().includes('year');
  const isMonth=id.toLowerCase().includes('month');
  const titlePeriodSelect=['monthlyYear','monthlyMonth','yearlyYear','filterYear','filterMonth'].includes(id);
  el.innerHTML=items.map(x=>{
    if(titlePeriodSelect){
      const label=['monthlyMonth','filterMonth'].includes(id)?String(x).padStart(2,'0'):String(x);
      return `<option value="${x}" ${String(x)===String(selected)?'selected':''}>${label}</option>`;
    }
    const label=isMonth&&id==='monthlyMonth'?String(x).padStart(2,'0')+'월':`${x}${isYear?'년':isMonth?'월':''}`;
    return `<option value="${x}" ${String(x)===String(selected)?'selected':''}>${label}</option>`;
  }).join('');
}
function initSelects(){
  const yearList=years();
  const monthList=Array.from({length:12},(_,i)=>i+1);
  ['filterYear','monthlyYear','yearlyYear'].forEach(id=>{
    const el=$(id);
    const prev=el && el.value ? Number(el.value) : 0;
    const target=yearList.includes(prev) ? prev : CURRENT_YEAR;
    fillSelect(id,yearList,target);
  });
  ['filterMonth','monthlyMonth'].forEach(id=>{
    const el=$(id);
    const prev=el && el.value ? Number(el.value) : 0;
    const target=monthList.includes(prev) ? prev : CURRENT_MONTH;
    fillSelect(id,monthList,target);
  });
  if(!yearList.includes(calendarYear))calendarYear=CURRENT_YEAR;
  if(calendarMonth<1 || calendarMonth>12)calendarMonth=CURRENT_MONTH;
}

function normalizeSavingLabel(v){return String(v||'').normalize('NFKC').replace(/[\s ]+/g,'').trim().toLowerCase()}
function isSavingTx(t){
  if(!t || t.type!=='지출')return false;
  const account=normalizeSavingLabel(t.account||t.method||t.paymentMethod);
  const category=normalizeSavingLabel(t.category||t.majorCategory);
  const configured=(state.categoryItems&&Array.isArray(state.categoryItems['저축형지출']))?state.categoryItems['저축형지출']:[];
  const item=normalizeSavingLabel(t.item||t.subCategory);
  const isRegisteredSavingItem=!!item&&configured.some(x=>normalizeSavingLabel(x)===item);
  return account==='저축통장'&&(category==='저축형지출'||isRegisteredSavingItem);
}
function isExpenseTx(t){
  return t.type==='지출' && !isSavingTx(t);
}
function isLotteCardTx(t){
  return String(t.account||'').replace(/\s+/g,'').includes('롯데카드');
}
function isCardTx(t){
  return isCardAccountName(t?.account) || String(t?.account||'').includes('카드');
}
function isUnlinkedCardExpenseTx(t){
  return isExpenseTx(t) && isCardTx(t) && !getLinkedBankForCard(t?.account);
}
function isCountedExpenseTx(t){
  return isExpenseTx(t) && !isUnlinkedCardExpenseTx(t);
}
function isNonLotteExpenseTx(t){
  return isCountedExpenseTx(t) && !isLotteCardTx(t);
}
function isAnyCardExpenseTx(t){
  return isExpenseTx(t) && isCardTx(t);
}
function sum(list,fn){return list.filter(fn).reduce((a,t)=>a+(+t.amount||0),0)}
function monthTx(y,m){return state.transactions.filter(t=>{const d=new Date(t.date+'T00:00:00');return d.getFullYear()==y&&d.getMonth()+1==m})}
function yearTx(y){return state.transactions.filter(t=>+t.date.slice(0,4)===+y)}
function prevYearMonth(y,m){
  if(m===1)return {y:y-1,m:12};
  return {y,m:m-1};
}
function totals(list, excludeLotte=false){
  const income=sum(list,t=>t.type==='수입');
  const expense=sum(list,excludeLotte?(t=>isNonLotteExpenseTx(t)):isCountedExpenseTx);
  const saving=sum(list,isSavingTx);
  return{income,expense,saving,balance:income-expense-saving};
}

function getEmergencyBalance(){
  return (state.emergency||[]).reduce((s,x)=>s+(x.kind==='출금'?-1:1)*(+x.amount||0),0);
}

function calcMonthsDiff(startStr,endStr){
  if(!startStr || !endStr)return 0;
  const s=new Date(startStr+'T00:00:00');
  const e=new Date(endStr+'T00:00:00');
  if(isNaN(s.getTime()) || isNaN(e.getTime()))return 0;
  let months=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth());
  if(e.getDate()<s.getDate())months-=1;
  return Math.max(0,months);
}

function calcSavingDetails(raw){
  const monthly=Math.max(0,Number(raw.monthly)||0);
  const rate=Math.max(0,Number(raw.rate)||0);
  const taxType=raw.taxType||'일반과세';

  const dateSpanMonths=calcMonthsDiff(raw.startDate,raw.maturityDate);
  const termMonths=Math.max(1,Number(raw.termMonths)||(dateSpanMonths>0?dateSpanMonths:12));
  const effectiveMonths=dateSpanMonths>0?Math.min(termMonths,dateSpanMonths):termMonths;

  let joinedMonths=0;
  if(raw.startDate){
    const s=new Date(raw.startDate+'T00:00:00');
    if(!isNaN(s.getTime())){
      const diffFromStart=(today.getFullYear()-s.getFullYear())*12+(today.getMonth()-s.getMonth())+(today.getDate()>=s.getDate()?1:0);
      joinedMonths=Math.min(effectiveMonths,Math.max(0,diffFromStart));
    }
  }
  const remainMonths=Math.max(0,effectiveMonths-joinedMonths);
  const currentSaved=monthly*joinedMonths;
  const principal=monthly*effectiveMonths;

  const grossInterest=Math.round(monthly*(effectiveMonths*(effectiveMonths+1)/2)*(rate/100/12));
  const taxRate=taxType==='비과세'?0:taxType==='세금우대'?0.095:0.154;
  const netInterest=Math.max(0,Math.round(grossInterest*(1-taxRate)));
  const maturityAmount=principal+netInterest;

  return {
    termMonths:effectiveMonths,
    joinedMonths,
    remainMonths,
    currentSaved,
    principal,
    interest:netInterest,
    maturityAmount
  };
}

function getSavingsBalance(){
  return (state.savings||[]).reduce((s,item)=>s+calcSavingDetails(item).currentSaved,0);
}

const DEFAULT_CARD_BANK_LINKS={
  '삼성카드':'자동이체',
  '하나카드':'저축통장',
  '채움카드':'월급통장'
};

function getLinkedBankForCard(accountName){
  const rawName=String(accountName||'').trim();
  const norm=rawName.replace(/\s+/g,'');
  if(state.cardBankLinks && Object.prototype.hasOwnProperty.call(state.cardBankLinks,rawName)){
    return String(state.cardBankLinks[rawName]||'').trim();
  }
  if(state.cardBankLinks){
    for(const [k,v] of Object.entries(state.cardBankLinks)){
      if(String(k).replace(/\s+/g,'')===norm)return String(v||'').trim();
    }
  }
  for(const [cardKey,bankVal] of Object.entries(DEFAULT_CARD_BANK_LINKS)){
    if(norm.includes(cardKey))return bankVal;
  }
  return '';
}

function isCardAccountName(accountName){
  const norm=String(accountName||'').replace(/\s+/g,'');
  return norm==='카드' || norm.includes('카드');
}

function txMatchesAccount(t, accName, accountSet){
  const normAcc=String(accName||'').replace(/\s+/g,'');
  if(t.type==='이체'){
    return {
      out:t.account===accName,
      in:(t.item===accName && accountSet.has(accName))
    };
  }
  const linkedBank=getLinkedBankForCard(t.account);
  const matched=(t.account===accName) || Boolean(linkedBank && normAcc.includes(linkedBank));
  return {
    in:matched && t.type==='수입',
    out:matched && t.type==='지출'
  };
}

function getCashAndBankBalances(){
  const targetAccounts=state.accounts.filter(acc=>!isCardAccountName(acc));
  const accountSet=new Set(state.accounts||[]);
  return targetAccounts.map(acc=>{
    const init=Number(state.accountInitials?.[acc])||0;
    const delta=state.transactions.reduce((s,t)=>{
      const amt=+t.amount||0;
      const m=txMatchesAccount(t,acc,accountSet);
      return s+(m.in?amt:0)-(m.out?amt:0);
    },0);
    return {name:acc,amount:init+delta};
  });
}

function isFixedRuleMatchedInTx(rule,tx){
  if(!isExpenseTx(tx))return false;
  const rName=(rule.name||'').trim().toLowerCase();
  const tMemo=(tx.memo||'').trim().toLowerCase();
  const tItem=(tx.item||'').trim().toLowerCase();
  return Boolean(rName && (tMemo.includes(rName) || tItem.includes(rName)));
}

function getFixedRuleActualPaid(rule, monthTransactions){
  const matched=monthTransactions.filter(tx=>isFixedRuleMatchedInTx(rule,tx));
  if(!matched.length)return 0;
  return matched.reduce((s,t)=>s+(+t.amount||0),0);
}

function getFixedExpenseStatus(rule,year,month,monthTransactions){
  const paid=monthTransactions.some(tx=>isFixedRuleMatchedInTx(rule,tx));
  if(paid){
    return {code:'done',label:'완료',cls:'status-done'};
  }
  const lastDayOfMonth=new Date(year,month,0).getDate();
  const dueDay=Math.min(Math.max(Number(rule.day)||1,1),lastDayOfMonth);

  if(year<CURRENT_YEAR || (year===CURRENT_YEAR && month<CURRENT_MONTH)){
    return {code:'overdue',label:'지연',cls:'status-overdue'};
  }
  if(year>CURRENT_YEAR || (year===CURRENT_YEAR && month>CURRENT_MONTH)){
    return {code:'upcoming',label:'예정',cls:'status-upcoming'};
  }
  if(CURRENT_DAY>dueDay){
    return {code:'overdue',label:'지연',cls:'status-overdue'};
  }
  return {code:'upcoming',label:'예정',cls:'status-upcoming'};
}

function renderDrilldownModalContent(){
  const {txType,categoryName,year,month,selectedSub,sortMode}=drilldownState;
  const sourceList=month ? monthTx(year,month) : yearTx(year);
  const filterFn=txType==='수입'
    ? t=>t.type==='수입'
    : txType==='저축'
      ? isSavingTx
      : isCountedExpenseTx;
  const matched=sourceList
    .filter(t=>filterFn(t) && (t.category||'미분류').trim()===categoryName)
    .sort((a,b)=>b.date.localeCompare(a.date));

  const subMap={};
  matched.forEach(t=>{
    const sub=(t.item && t.item.trim()) ? t.item.trim() : '(항목명 없음)';
    if(!subMap[sub])subMap[sub]={name:sub,count:0,amount:0};
    subMap[sub].count+=1;
    subMap[sub].amount+=(+t.amount||0);
  });
  const subList=Object.values(subMap).sort((a,b)=>(b.count-a.count)||(b.amount-a.amount)||a.name.localeCompare(b.name,'ko'));
  const periodLabel=month ? `${year}년 ${month}월` : `${year}년`;

  const showDetailSection=Boolean(selectedSub) || sortMode==='__ALL__';
  let detailList=selectedSub
    ? matched.filter(t=>((t.item && t.item.trim()) ? t.item.trim() : '(항목명 없음)')===selectedSub)
    : matched.slice();

  if(sortMode==='amount_desc'){
    detailList.sort((a,b)=>((+b.amount||0)-(+a.amount||0))||b.date.localeCompare(a.date));
  }else if(sortMode==='sub_group'){
    detailList.sort((a,b)=>{
      const sa=(a.item && a.item.trim()) ? a.item.trim() : '(항목명 없음)';
      const sb=(b.item && b.item.trim()) ? b.item.trim() : '(항목명 없음)';
      return sa.localeCompare(sb,'ko') || b.date.localeCompare(a.date);
    });
  }else{
    detailList.sort((a,b)=>b.date.localeCompare(a.date));
  }

  const amtColorClass=txType==='수입'?'positive':'negative';
  const isYearlyMonthSubModal=(drilldownState.scope==='yearly' && Boolean(month));
  const isYearlyYearSubModal=(drilldownState.scope==='yearly' && !month);
  const isMonthlyCatModal=(drilldownState.scope==='monthly' && Boolean(month));
  const backFn=isYearlyMonthSubModal
    ? `openYearlyMonthCategoryModal('${txType}',${year},${month})`
    : isYearlyYearSubModal
      ? `openYearlyCategoryModal('${txType}',${year})`
      : `openHubModal('ledger')`;

const data_uri = document.querySelector('.monthly-nav-img')?.src || '';

const LAST_PAGE_STORAGE_KEY = 'chokobi_last_page_v1';
const VALID_PAGES = ['day', 'monthly', 'ledger', 'assets', 'settings'];

function getSavedPageName() {
  try {
    const saved = localStorage.getItem(LAST_PAGE_STORAGE_KEY);
    if (saved && VALID_PAGES.includes(saved)) {
      return saved;
    }
  } catch (_e) {}
  return 'settings';
}

function saveCurrentPageName(name) {
  if (!VALID_PAGES.includes(name)) return;
  try {
    localStorage.setItem(LAST_PAGE_STORAGE_KEY, name);
  } catch (_e) {}
}

function page(name) {
  const targetPage = VALID_PAGES.includes(name) ? name : 'settings';
  document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
  if ($('page-' + targetPage)) $('page-' + targetPage).classList.remove('hidden');

  const titles = {
    day: ['하루', `흰둥이 산책만 하고 돈 안 쓴 날을 체크해요! ${shiroSvg(15)}`],

let dayTodayListExpanded=false;

function normalizeQuickType(val){
  if(val==='수입')return '수입';
  if(val==='이체')return '이체';
  return '지출';
}

function ensureDayQuickDraft(){
  const todayStr=`${CURRENT_YEAR}-${String(CURRENT_MONTH).padStart(2,'0')}-${String(CURRENT_DAY).padStart(2,'0')}`;
  if(!state.dayQuickDraft || typeof state.dayQuickDraft!=='object'){
    state.dayQuickDraft={type:'지출',date:todayStr,account:'',category:'',item:'',amount:'',memo:''};
  }
  const draft=state.dayQuickDraft;
  draft.type=normalizeQuickType(draft.type);
  draft.date=draft.date?normalizeDateString(draft.date):todayStr;

  if(draft.type==='이체'){
    draft.category='계좌이체';
    const bankPool=(state.accounts||[]).filter(acc=>!isCardAccountName(acc));
    if(!draft.account || (bankPool.length && !bankPool.includes(draft.account))){
      draft.account=bankPool[0]||'';
    }
    if(!draft.item || draft.item===draft.account || (bankPool.length && !bankPool.includes(draft.item))){
      draft.item=bankPool.find(acc=>acc!==draft.account)||'';
    }
  }else{
    const catPool=draft.type==='수입'?state.income:state.expense;
    if(!draft.category || (catPool.length && !catPool.includes(draft.category))){
      draft.category=catPool[0]||(draft.type==='수입'?'기타수입':'기타비');
    }
    const accPool=state.accounts||[];
    if(!draft.account || (accPool.length && !accPool.includes(draft.account))){
      draft.account=accPool[0]||'';
    }
    const itemPool=getItemsForCategory(draft.category,draft.type);
    if(!draft.item && itemPool.length){
      draft.item=itemPool[0];
    }
  }
  return draft;
}

function updateDayQuickDraftField(field,val,rebuild=false){
  const draft=ensureDayQuickDraft();
  if(field==='type'){
    draft.type=normalizeQuickType(val);
    if(draft.type==='이체'){
      draft.category='계좌이체';
      const bankPool=(state.accounts||[]).filter(acc=>!isCardAccountName(acc));
      draft.account=bankPool[0]||'';
      draft.item=bankPool.find(acc=>acc!==draft.account)||'';
    }else{
      const catPool=draft.type==='수입'?state.income:state.expense;
      draft.category=catPool[0]||(draft.type==='수입'?'기타수입':'기타비');
      const accPool=state.accounts||[];
      if(!accPool.includes(draft.account))draft.account=accPool[0]||'';
      const itemPool=getItemsForCategory(draft.category,draft.type);
      draft.item=itemPool[0]||'';
    }
  }else if(field==='date'){
    draft.date=normalizeDateString(val);
  }else if(field==='account' && draft.type==='이체'){
    draft.account=String(val||'');
    if(draft.item===draft.account){
      const bankPool=(state.accounts||[]).filter(acc=>!isCardAccountName(acc));
      draft.item=bankPool.find(acc=>acc!==draft.account)||'';
    }
  }else if(field==='category'){
    draft.category=String(val||'');
    const itemPool=getItemsForCategory(draft.category,draft.type);
    draft.item=itemPool[0]||'';
  }else{
    draft[field]=String(val??'');
  }
  save();
  if(rebuild)renderDay();
}

function submitDayQuickTx(e){
  e.preventDefault();
  const draft=ensureDayQuickDraft();
  const amt=Number(draft.amount)||0;
  if(amt<=0){
    alert('금액을 1원 이상 입력해 주세요.');
    $('dayQuickAmount')?.focus({preventScroll:true});
    return;
  }
  if(draft.type==='이체'){
    if(!draft.account){alert('출금 계좌를 선택해 주세요.');return;}
    if(!draft.item){alert('입금 계좌를 선택해 주세요.');return;}
    if(draft.item===draft.account){alert('출금 계좌와 입금 계좌는 서로 달라야 합니다.');return;}
  }
  const txDate=normalizeDateString(draft.date);
  const categoryVal=draft.type==='이체'?'계좌이체':draft.category;
  if(draft.item && draft.type!=='이체'){
    if(!state.categoryItems[categoryVal])state.categoryItems[categoryVal]=[];
    if(!state.categoryItems[categoryVal].includes(draft.item))state.categoryItems[categoryVal].push(draft.item);
  }
  state.transactions.push({
    id:String(Date.now()),
    date:txDate,
    amount:amt,
    type:draft.type,
    account:draft.account,
    category:categoryVal,
    item:draft.item,
    memo:draft.memo
  });
  draft.amount='';
  draft.memo='';
  save();
  render();
}

let dayDetailModalDate='';

function changeDaySummaryYMD(part,val){
  const parts=normalizeDateString(daySummaryDate).split('-').map(Number);
  let y=parts[0]||CURRENT_YEAR;
  let m=parts[1]||CURRENT_MONTH;
  let d=parts[2]||CURRENT_DAY;
  if(part==='year')y=Number(val)||y;
  else if(part==='month')m=Number(val)||m;
  else if(part==='day')d=Number(val)||d;
  const maxDay=new Date(y,m,0).getDate();
  if(d>maxDay)d=maxDay;
  daySummaryDate=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  calendarYear=y;
  calendarMonth=m;
  renderDay();
}

function selectDayFromCalendar(dateStr){

  daySummaryDate=ds;
  const [y,m]=ds.split('-').map(Number);

  renderDay();
}

function renderLedger(){
  if(!$('ledgerTable'))return;
  const y=+$('filterYear').value||0;
  const m=+$('filterMonth').value||0;
  const type=$('filterType').value;
  const q=$('search').value.toLowerCase();
  const l=state.transactions.filter(t=>
    (!y||+t.date.slice(0,4)===y)&&
    (!m||+t.date.slice(5,7)===m)&&
    (!type || (type==='지출'?isExpenseTx(t):t.type===type))&&
    (!q||[t.category,t.item,t.memo,t.account].join(' ').toLowerCase().includes(q))
  ).sort((a,b)=>b.date.localeCompare(a.date));

  $('ledgerTable').innerHTML=tableTx(l,true);
}

        ? `<div class="kv-list">${cardList.map(c=>`

              <span><b>${esc(c.name)}</b> <span class="muted">(${c.count}회)</span></span>
              <b style="color:var(--amber);text-align:right">${won(c.amount)}</b>
            </div>`).join('')}</div>`
        : '<div class="empty">카드 내역이 없습니다.</div>'}
    </div>
    ${showDetailSection ? `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <div class="sub-summary-title" style="margin:0">
          상세 거래 내역 ${selectedCard?`<span class="tag save" style="margin-left:6px">${esc(selectedCard)} (${detailList.length}건)</span>`:`(${detailList.length}건)`}

      </div>
      ${detailList.length
        ? `<div class="tablewrap"><table><thead><tr><th>날짜</th><th>대분류</th><th>항목명</th><th>결제수단</th><th>메모</th><th class="num">금액</th></tr></thead><tbody>${

          }</tbody></table></div>`
        : '<div class="empty">상세 거래 내역이 없습니다.</div>'}
    ` : ''}`;
}

function getNoSpendDaysCount(year,month,monthTransactions){
  const daysInMonth=new Date(year,month,0).getDate();
  let zeros=0;
  const elapsedDays=year<today.getFullYear() || (year===today.getFullYear() && month<today.getMonth()+1)
    ? daysInMonth : year===today.getFullYear() && month===today.getMonth()+1 ? today.getDate() : 0;
  for(let d=1;d<=elapsedDays;d++){
    const ds=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const spent=sum(monthTransactions,t=>t.date===ds && isCountedExpenseTx(t));
    if(!spent)zeros++;
  }
  return {zeros,daysInMonth:elapsedDays};
}

function getYearlyNoSpendStats(year,yearTransactions){
  const spentByDate={};
  yearTransactions.filter(isCountedExpenseTx).forEach(t=>{
    const ds=t.date;
    spentByDate[ds]=(spentByDate[ds]||0)+(+t.amount||0);
  });
  let zeros=0;
  let totalDays=0;
  const lastMonth=year<today.getFullYear()?12:year===today.getFullYear()?today.getMonth()+1:0;
  for(let m=1;m<=lastMonth;m++){
    const daysInMonth=new Date(year,m,0).getDate();
    const lastDay=(year===today.getFullYear() && m===today.getMonth()+1)?today.getDate():daysInMonth;
    for(let d=1;d<=lastDay;d++){
      totalDays++;
      const ds=`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(!spentByDate[ds])zeros++;
    }
  }
  const ratio=totalDays?(zeros/totalDays*100):0;
  return {zeros,totalDays,ratio};
}

function getNetWorth(){
  const manualAssets=(state.assets||[]).reduce((s,x)=>s+(+x.amount||0),0);
  const emergencyBal=getEmergencyBalance();
  const savingsBal=getSavingsBalance();
  const totalAssets=manualAssets+emergencyBal+savingsBal;
  const totalDebts=(state.debts||[]).reduce((s,x)=>s+(+x.amount||0),0);
  return totalAssets-totalDebts;
}

function getAccountMonthFlowStats(accName, year, month){
  const accountSet=new Set(state.accounts||[]);
  let income=0,expense=0;
  monthTx(year,month).forEach(t=>{
    const amt=+t.amount||0;
    const m=txMatchesAccount(t,accName,accountSet);
    if(m.in)income+=amt;
    if(m.out)expense+=amt;
  });
  return {income,expense};
}

function getAccountCumulativeBalanceAtMonthEnd(accName, year, month){
  const accountSet=new Set(state.accounts||[]);
  const init=Number(state.accountInitials?.[accName])||0;
  const maxYm=year*100+month;
  const delta=state.transactions.reduce((s,t)=>{
    const dt=new Date(t.date+'T00:00:00');
    if(isNaN(dt.getTime()))return s;
    if(dt.getFullYear()*100+(dt.getMonth()+1)>maxYm)return s;
    const amt=+t.amount||0;
    const m=txMatchesAccount(t,accName,accountSet);
    return s+(m.in?amt:0)-(m.out?amt:0);
  },0);
  return init+delta;
}

function renderMomComparisonLine(currAmt, prevAmt, kind='neutral'){
  const diff=(Number(currAmt)||0)-(Number(prevAmt)||0);
  const sign=diff>0?'+':diff<0?'-':'';
  const amtStr=`${sign}${won(Math.abs(diff))}`;
  let pctStr='0%';
  if(prevAmt>0){
    const pct=Math.round((diff/prevAmt)*100);
    pctStr=`${pct>0?'+':''}${pct}%`;
  }else if(prevAmt===0 && currAmt>0){
    pctStr='신규';
  }
  let color='var(--muted)';
  if(diff>0)color=kind==='expense'?'var(--red)':'var(--green)';
  else if(diff<0)color=kind==='expense'?'var(--green)':'var(--red)';
  return `<div style="display:flex;justify-content:flex-end;align-items:baseline;gap:4px;margin-top:6px;font-size:11px;font-weight:700;text-align:right;color:${color}"><span>${amtStr}</span><span>/</span><span>${pctStr}</span></div>`;
}

function openHubModal(kind){
  const y=+$('monthlyYear')?.value||CURRENT_YEAR;
  const m=+$('monthlyMonth')?.value||CURRENT_MONTH;
  const l=monthTx(y,m);

  if(kind==='ledger'){
    const prevYM=prevYearMonth(y,m);
    const prevL=monthTx(prevYM.y,prevYM.m);

    const prevIncCats={};
    prevL.filter(x=>x.type==='수입').forEach(x=>{
      const c=(x.category||'미분류').trim();
      prevIncCats[c]=(prevIncCats[c]||0)+(+x.amount||0);
    });

    const incCats={};
    l.filter(x=>x.type==='수입').forEach(x=>{

    const prevExpCats={};

      const c=(x.category||'미분류').trim();
      prevExpCats[c]=(prevExpCats[c]||0)+(+x.amount||0);
    });

    const expCats={};
    l.filter(isCountedExpenseTx).forEach(x=>{
      const c=(x.category||'미분류').trim();
      expCats[c]=(expCats[c]||0)+(+x.amount||0);
    });

    const maxExp=Math.max(1,...sortedExp.map(x=>x[1]));
    const totalExp=sortedExp.reduce((s,x)=>s+x[1],0);

    const formatPrevChangePct=(currAmt,prevAmt)=>{
      const c=Number(currAmt)||0;

        }

          return `<span class="chg-pct" style="color:var(--blue);text-align:right" title="전월 ${won(p)} 대비 ${diffPct}%">${diffPct}%</span>`;
        }
        return `<span class="chg-pct" style="color:var(--muted);text-align:right" title="전월 ${won(p)} 동일">0%</span>`;
      }
      if(c>0){
        return `<span class="chg-pct" style="color:var(--muted);text-align:right" title="전월 0원">-</span>`;
      }
      return `<span class="chg-pct empty-pct" style="text-align:right">0%</span>`;
    };

    $('detailHeading').textContent=`수입 / 지출 분류별 · ${y}년 ${m}월`;
    $('detailBody').innerHTML=`
      <div class="sub-summary-box" style="margin-bottom:12px">
        <div class="card-head-top" style="margin-bottom:8px">
          <h4 class="sub-summary-title" style="margin:0">수입 분류별</h4>
          <div style="text-align:right"><b class="positive">${won(totalInc)}</b></div>
        </div>
        ${sortedInc.length
          ? sortedInc.map(([k,v])=>`
            <div class="barrow click-cat" title="클릭하여 항목 및 상세 거래내역 보기" onclick="openCategoryDrilldown('monthly','수입',${jsAttr(k)},${y},${m})">
              <span>${esc(k)}</span>
              <div class="track"><div class="fill" style="width:${v/maxInc*100}%;background:#20a27d"></div></div>
              <span class="amt-cell" style="grid-template-columns:auto 52px;justify-content:end;text-align:right">
                <span class="amt-val" style="font-weight:700;color:#20a27d;text-align:right">${won(v)}</span>
                ${formatPrevChangePct(v,prevIncCats[k])}
              </span>
            </div>`).join('')
          : '<div class="empty" style="padding:12px 0">수입 내역 없음</div>'}
      </div>
      <div class="sub-summary-box" style="margin-bottom:0">
        <div class="card-head-top" style="margin-bottom:8px">
          <h4 class="sub-summary-title" style="margin:0">지출 분류별</h4>
          <div style="text-align:right"><b class="negative">${won(totalExp)}</b></div>
        </div>
        ${sortedExp.length
          ? sortedExp.map(([k,v])=>`
            <div class="barrow click-cat" title="클릭하여 항목 및 상세 거래내역 보기" onclick="openCategoryDrilldown('monthly','지출',${jsAttr(k)},${y},${m})">

      .filter(r=>r && r.active!==false)
      .slice()

      const st=getFixedExpenseStatus(r,y,m,l);

function getExpenseItemRankingData(list, scope){
  const expTxs = list.filter(t => t.type === '지출' && isCountedExpenseTx(t));
  const totalExp = expTxs.reduce((s, t) => s + (+t.amount || 0), 0);
  const itemMap = {};
  expTxs.forEach(t => {
    const itemName = (t.item && t.item.trim()) ? t.item.trim() : ((t.category && t.category.trim()) ? t.category.trim() : '(항목명 없음)');
    const catName = (t.category && t.category.trim()) ? t.category.trim() : '미분류';
    const key = `${catName}__${itemName}`;
    if(!itemMap[key]){
      itemMap[key] = { name: itemName, category: catName, amount: 0, count: 0 };
    }
    itemMap[key].amount += (+t.amount || 0);
    itemMap[key].count += 1;
  });

  const minCount = scope === 'yearly' ? 12 : 2;
  const ranked = Object.values(itemMap)
    .filter(r => r.count >= minCount)
    .sort((a, b) => (b.count - a.count) || (b.amount - a.amount) || a.name.localeCompare(b.name, 'ko'));

  return { ranked, totalExp, minCount };
}

function buildExpenseItemRankingHtml(list, scope, year, month, limit=10){
  const { ranked, totalExp } = getExpenseItemRankingData(list, scope);
  const rows = limit > 0 ? ranked.slice(0, limit) : ranked;

  if(!rows.length){
    return `<div class="empty">${scope === 'yearly' ? '월 평균 1회(연 12회) 이상 지출' : '월 2회 이상 지출'}된 항목이 없습니다.</div>`;
  }

  return `<div class="tablewrap">
    <table style="font-size:11.5px">
      <thead>
        <tr>
          <th class="center" style="padding:8px 5px"></th>
          <th class="left" style="padding:8px 6px">항목</th>
          <th class="num" style="padding:8px 6px">지출 금액</th>
          <th class="center" style="padding:8px 5px">빈도</th>
          <th class="num" style="padding:8px 5px">비중</th>
          <th class="num" style="padding:8px 6px">1회 평균</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r, idx) => {
          const share = totalExp > 0 ? (r.amount / totalExp * 100) : 0;
          const avg = r.count > 0 ? Math.round(r.amount / r.count) : 0;
          return `<tr style="cursor:pointer" title="클릭하여 '${esc(r.name)}' 상세내역 보기" onclick="event.stopPropagation();openExpenseItemRankingDetail('${scope}',${jsAttr(r.category)},${jsAttr(r.name)},${year},${month})">
            <td class="center" style="padding:9px 5px">${idx + 1}</td>
            <td class="left" style="padding:9px 6px"><b>${esc(r.name)}</b> <span class="sub">(${esc(r.category)})</span></td>
            <td class="num negative" style="padding:9px 6px">${won(r.amount)}</td>
            <td class="center" style="padding:9px 5px">${r.count}회</td>
            <td class="num" style="padding:9px 5px">${share.toFixed(1)}%</td>
            <td class="num" style="padding:9px 6px">${won(avg)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function openExpenseItemRankingModal(scope, year, month=0){
  const sourceList = month ? monthTx(year, month) : yearTx(year);

  resetDetailModalHeader();

    $('detailHeadRight').innerHTML = `<button type="button" class="ghost small" onclick="openHubModal('yearly')">← 전체 목록</button>`;
  }
  $('detailBody').innerHTML = buildExpenseItemRankingHtml(sourceList, scope, year, month, 0);
  $('detailModal').classList.add('show');
}

function openExpenseItemRankingDetail(scope, categoryName, itemName, year, month=0){
  const sourceList = month ? monthTx(year, month) : yearTx(year);
  const matched = sourceList
    .filter(t => {
      if(!isCountedExpenseTx(t)) return false;
      const tCat = (t.category && t.category.trim()) ? t.category.trim() : '미분류';
      const tItem = (t.item && t.item.trim()) ? t.item.trim() : ((t.category && t.category.trim()) ? t.category.trim() : '(항목명 없음)');
      return tCat === categoryName && tItem === itemName;
    })
    .sort((a, b) => b.date.localeCompare(a.date));

  const totalAmt = matched.reduce((s, t) => s + (+t.amount || 0), 0);
  const avgAmt = matched.length ? Math.round(totalAmt / matched.length) : 0;
  const periodLabel = month ? `${year}년 ${month}월` : `${year}년`;

  resetDetailModalHeader();
  $('detailHeading').textContent = `${periodLabel} · ${itemName} (${categoryName}) 내역`;
  if($('detailHeadRight')){
    $('detailHeadRight').innerHTML=`<button type="button" class="ghost small" onclick="openExpenseItemRankingModal('${scope}',${year},${month})">← 목록으로</button>`;
  }
  $('detailBody').innerHTML = `

      <div class="sub-summary-box" style="margin-bottom:0">

        <div class="metric-label">빈도</div>
        <div class="metric" style="font-size:17px;text-align:right">${matched.length}회</div>
      </div>
      <div class="sub-summary-box" style="margin-bottom:0">
        <div class="metric-label">1회 평균</div>
        <div class="metric" style="font-size:17px;text-align:right">${won(avgAmt)}</div>
      </div>
    </div>
    ${matched.length
      ? `<div class="tablewrap"><table><thead><tr><th>날짜</th><th>항목</th><th>결제수단</th><th class="num">금액</th></tr></thead><tbody>${
          matched.map(t => `<tr><td>${esc(t.date || '-')}</td><td>${esc(t.item || '-')}</td><td>${esc(t.account || '-')}</td><td class="num negative"><b>${won(t.amount)}</b></td></tr>`).join('')

function buildCategoryBreakdown(list,txType,minCount=1){
  const matchFn=txType==='수입'
    ? x=>x.type==='수입'
    : isCountedExpenseTx;
  const stats={};
  list.filter(matchFn).forEach(x=>{
    const cat=(x.category||'미분류').trim();
    if(!stats[cat])stats[cat]={name:cat,count:0,amount:0};
    stats[cat].count+=1;
    stats[cat].amount+=(+x.amount||0);
  });
  return Object.values(stats)
    .filter(item=>item.count>=minCount)
    .sort((a,b)=>(b.count-a.count)||(b.amount-a.amount)||a.name.localeCompare(b.name,'ko'));
}

function getYearlyBalanceStats(year, arr, yList, t){
  const activeMonths = arr.filter(x => x.income > 0 || x.expense > 0 || x.saving > 0).length || 12;
  const avgIncome = Math.round((t.income || 0) / activeMonths);
  const avgExpense = Math.round((t.expense || 0) / activeMonths);
  const avgSaving = Math.round((t.saving || 0) / activeMonths);
  return { avgIncome, avgExpense, avgSaving };
}

  const ds=normalizeDateString(dateStr);

    $('txType').value='수입';

    $('txType').value='지출';
    syncCats();
    const nonCardAcc=(state.accounts||[]).find(a=>!isCardAccountName(a));
    if(nonCardAcc)$('txAccount').value=nonCardAcc;
    updateTxAccountHint();
  }else if(f==='카드'){
    $('txType').value='지출';
    syncCats();
    const cardAcc=(state.accounts||[]).find(a=>isCardAccountName(a));
    if(cardAcc)$('txAccount').value=cardAcc;
    updateTxAccountHint();
  }
}

function buildCalendarMarkup({onDayClickFn='openCalendarDayDetail',selectedDateStr='',showPeriod=true}={}){
  const y=calendarYear||CURRENT_YEAR;
  const m=calendarMonth||CURRENT_MONTH;
  const yearList=years();
  const first=new Date(y,m-1,1);
  const offset=first.getDay();
  const days=new Date(y,m,0).getDate();
  const l=monthTx(y,m);
  const monthIncome=sum(l,t=>t.type==='수입');
  const monthNonCardSpent=sum(l,isCountedExpenseTx);
  const monthUnlinkedCardSpent=sum(l,isUnlinkedCardExpenseTx);

  let out=`
    <div class="card-head-top">
      ${showPeriod ? `<div class="cal-inline-period">
        <select id="calYear" aria-label="달력 년도 선택" onchange="changeCalendarPeriod('year',this.value)">${
          yearList.map(yr=>`<option value="${yr}" ${yr===y?'selected':''}>${yr}</option>`).join('')
        }</select><span class="period-unit">년</span>
        <select id="calMonth" aria-label="달력 월 선택" onchange="changeCalendarPeriod('month',this.value)">${
          Array.from({length:12},(_,i)=>i+1).map(mo=>`<option value="${mo}" ${mo===m?'selected':''}>${mo}</option>`).join('')
        }</select><span class="period-unit">월</span>
      </div>` : ''}
      <div class="cal-summary-bar">
        <span class="cal-lbl">수입 :</span><span class="cal-val positive">${won(monthIncome)}</span>
        <span class="cal-lbl">지출 :</span><span class="cal-val negative">${won(monthNonCardSpent)}</span>
        <span class="cal-lbl">카드 :</span><span class="cal-val" style="color:var(--amber)">${won(monthUnlinkedCardSpent)}</span>
      </div>
    </div>
    <div class="monthgrid">${
      ['일','월','화','수','목','금','토'].map(x=>`<div class="cal-week-head">${x}</div>`).join('')
    }`;
  for(let i=0;i<offset;i++)out+='<div></div>';
  let zeros=0;
  const elapsedDays=y<today.getFullYear() || (y===today.getFullYear() && m<today.getMonth()+1)
    ? days : y===today.getFullYear() && m===today.getMonth()+1 ? today.getDate() : 0;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayInc=sum(l,t=>t.date===ds && t.type==='수입');
    const dayNonCardExp=sum(l,t=>t.date===ds && isCountedExpenseTx(t));
    const dayCardExp=sum(l,t=>t.date===ds && isUnlinkedCardExpenseTx(t));
    const dayTotalExp=dayNonCardExp+dayCardExp;
    if(d<=elapsedDays && !dayTotalExp)zeros++;

    const numOnly=n=>(Number(n)||0).toLocaleString('ko-KR');
    const lines=[];
    lines.push(`<div class="day-inc">${dayInc>0?numOnly(dayInc):'&nbsp;'}</div>`);
    lines.push(`<div class="day-exp">${dayNonCardExp>0?numOnly(dayNonCardExp):'&nbsp;'}</div>`);
    lines.push(`<div class="day-card">${dayCardExp>0?numOnly(dayCardExp):'&nbsp;'}</div>`);
    if(d<=elapsedDays && !dayTotalExp)lines.push(`<div class="zero">${shiroSvg(14)}<span>초코비</span></div>`);

    const isSelected=selectedDateStr && ds===selectedDateStr;
    out+=`<div class="day${isSelected?' selected-day':''}" role="button" tabindex="0" title="${y}년 ${m}월 ${d}일 상세 보기" onclick="${onDayClickFn}('${ds}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${onDayClickFn}('${ds}')}"><b>${d}</b>${lines.join('')}</div>`;
  }
  out+='</div><p class="footnote">현재 월 무지출 일수: <b>'+zeros+'일</b></p>';
  return out;
}

$('savingForm').addEventListener('submit',e=>{
  e.preventDefault();
  const id=$('savingId').value||'sv_'+Date.now();
  const name=$('savingName').value.trim();
  const monthly=Math.max(0,+$('savingMonthly').value||0);
  const startDate=$('savingStartDate').value;
  const maturityDate=$('savingMaturityDate').value;
  const termMonths=Math.max(1,+$('savingTermMonths').value||1);
  const rate=Math.max(0,+$('savingRate').value||0);
  const taxType=$('savingTaxType').value;
  const method=$('savingMethod').value;
  if(!name)return;

  const nextSaving={id,name,monthly,startDate,maturityDate,termMonths,rate,taxType,method};
  if(!Array.isArray(state.savings))state.savings=[];
  const idx=state.savings.findIndex(x=>x.id===id);
  if(idx>=0)state.savings[idx]=nextSaving;
  else state.savings.push(nextSaving);

  save();
  closeModal('savingModal');
  render();
});

function deleteSaving(id){
  if(confirm('이 적금 항목을 삭제할까요?')){
    state.savings=(state.savings||[]).filter(x=>x.id!==id);
    save();
    render();

}

$('accountEditForm').addEventListener('submit',e=>{
  e.preventDefault();
  const idx=Number($('accountEditIndex').value);
  const oldName=state.accounts[idx];
  if(oldName===undefined)return;
  const nextName=$('accountEditName').value.trim();
  const nextInit=Number($('accountEditInit').value)||0;
  if(!nextName)return;

  if(!state.accountInitials)state.accountInitials={};
  if(oldName!==nextName){
    const prevInit=Number(state.accountInitials[oldName])||0;
    delete state.accountInitials[oldName];
    state.transactions.forEach(t=>{
      if(t.account===oldName)t.account=nextName;
      if(t.type==='이체' && t.item===oldName)t.item=nextName;
    });
    if(Array.isArray(state.categoryItems?.['이체'])){
      state.categoryItems['이체']=[...new Set(state.categoryItems['이체'].map(x=>x===oldName?nextName:x))];
    }
    state.accountInitials[nextName]=nextInit||prevInit;
    if(state.cardBankLinks){
      Object.keys(state.cardBankLinks).forEach(cardKey=>{
        if(state.cardBankLinks[cardKey]===oldName)state.cardBankLinks[cardKey]=nextName;
      });
    }
  }else{
    state.accountInitials[nextName]=nextInit;
  }
  state.accounts[idx]=nextName;

  save();
  closeModal('accountEditModal');
  render();
});

$('cardForm').addEventListener('submit',e=>{
  e.preventDefault();
  const oldName=$('cardOldName').value.trim();
  let nextName=$('cardNameInput').value.trim();
  const linkedBank=$('cardLinkedBankSelect').value.trim();
  if(!nextName)return;
  if(!isCardAccountName(nextName))nextName+='카드';

  if(!state.cardBankLinks)state.cardBankLinks={};
  if(!state.accountInitials)state.accountInitials={};

  if(oldName){
    const idx=state.accounts.indexOf(oldName);
    if(oldName!==nextName && state.accounts.includes(nextName)){
      alert('이미 등록된 카드 이름입니다.');
      return;
    }
    if(idx>=0)state.accounts[idx]=nextName;
    else if(!state.accounts.includes(nextName))state.accounts.push(nextName);

    if(oldName!==nextName){
      delete state.cardBankLinks[oldName];
      const prevInit=Number(state.accountInitials[oldName])||0;
      delete state.accountInitials[oldName];
      state.accountInitials[nextName]=prevInit;
      state.transactions.forEach(t=>{
        if(t.account===oldName)t.account=nextName;

    }
  }else{
    if(state.accounts.includes(nextName)){
      alert('이미 등록된 카드 이름입니다.');
      return;
    }
    state.accounts.push(nextName);
    state.accountInitials[nextName]=0;

  state.cardBankLinks[nextName]=linkedBank;
  save();
  closeModal('cardModal');
  render();
});

function editSingleItem(k,i){
  const oldVal=state[k][i];
  const next=prompt('새 이름을 입력하세요.',oldVal);
  if(next===null)return;
  const trimmed=next.trim();
  if(!trimmed)return;

  if((k==='expense' || k==='income') && oldVal!==trimmed){
    const targetTxType=k==='income'?'수입':'지출';
    const matchedTxCount=state.transactions.filter(t=>t.type===targetTxType && t.category===oldVal).length;
    const syncTx=matchedTxCount>0
      ? confirm(`기존 ${targetTxType} 거래 ${matchedTxCount}건의 대분류도 '${oldVal}'에서 '${trimmed}'(으)로 함께 변경할까요?`)
      : false;

    const mergedSubs=[
      ...(state.categoryItems[trimmed]||[]),
      ...(state.categoryItems[oldVal]||[])
    ];
    state.categoryItems[trimmed]=[...new Set(mergedSubs)];
    if(!state[k].some((x,idx)=>idx!==i && x===oldVal)){
      delete state.categoryItems[oldVal];
    }
    if(k==='expense'){
      (state.fixedExpenses||[]).forEach(r=>{if(r.category===oldVal)r.category=trimmed});
    }
    if(syncTx){
      state.transactions.forEach(t=>{
        if(t.type===targetTxType && t.category===oldVal)t.category=trimmed;
      });
    }
  }

  state[k][i]=trimmed;
  save();
  render();
}

function removeCategory(k,i){
  const target=state[k][i];
  if(target===undefined)return;
  if(k==='accounts'){
    const usedTxCount=state.transactions.filter(t=>t.account===target || (t.type==='이체' && t.item===target)).length;
    const msg=usedTxCount>0
      ? `'${target}' 계좌는 기존 거래 ${usedTxCount}건에서 참조 중입니다. 계좌 목록에서 삭제할까요? (기존 거래 내역은 유지됩니다)`
      : `'${target}' 계좌를 삭제할까요?`;
    if(!confirm(msg))return;
    if(state.accountInitials)delete state.accountInitials[target];
    if(state.cardBankLinks){
      delete state.cardBankLinks[target];
      Object.keys(state.cardBankLinks).forEach(cardKey=>{
        if(state.cardBankLinks[cardKey]===target)state.cardBankLinks[cardKey]='';
      });
    }
    if(Array.isArray(state.categoryItems?.['이체'])){
      state.categoryItems['이체']=state.categoryItems['이체'].filter(x=>x!==target);
    }
  }
  if((k==='expense' || k==='income') && state.categoryItems && !state[k].some((x,idx)=>idx!==i && x===target)){
    delete state.categoryItems[target];
  }
  state[k].splice(i,1);
  save();
  render();
}

  const y=parts[0]||today.getFullYear(),m=parts[1]||today.getMonth()+1,d=parts[2]||today.getDate();
  const yearsSet=new Set();
  for(let n=today.getFullYear()-10;n<=today.getFullYear()+1;n++)yearsSet.add(n);
  (state.transactions||[]).forEach(tx=>{const n=Number((tx.date||'').slice(0,4));if(n)yearsSet.add(n)});
  yearsSet.add(y);
  $('txDateYear').innerHTML=[...yearsSet].sort((a,b)=>b-a).map(n=>`<option value="${n}">${n}</option>`).join('');
  $('txDateMonth').innerHTML=Array.from({length:12},(_,i)=>i+1).map(n=>`<option value="${n}">${String(n).padStart(2,'0')}</option>`).join('');
  $('txDateDay').innerHTML=Array.from({length:31},(_,i)=>i+1).map(n=>`<option value="${n}">${String(n).padStart(2,'0')}</option>`).join('');
  $('txDateYear').value=String(y);$('txDateMonth').value=String(m);$('txDateDay').value=String(d);
  syncTxDate();
}

  const selEl=$('simpleSelect');

  if(selectConfig && Array.isArray(selectConfig.options) && selectConfig.options.length){

    }).join('');

    selEl.innerHTML='';

  $('simpleFields').innerHTML=fields.map(f=>`<div class="field ${f.wide?'wide':''}"><label>${f.label}</label><input name="${f.name}" type="${f.type||'text'}" ${f.step?`step="${esc(f.step)}"`:''} value="${esc(f.value??'')}" ${f.required?'required':''}></div>`).join('');

    if(selectConfig && selectConfig.name){
      d[selectConfig.name]=selEl.value;

    save();
    render();
  };
  $('simpleModal').classList.add('show');
}

      amount:+d.amount||0,
      monthlyPayment:+d.monthlyPayment||0,
      maturityDate:d.maturityDate||''
    };
    if(idx>=0)state.debts[idx]=item;
    else state.debts.push(item);
  });
}
function removeAsset(k,i){state[k].splice(i,1);save();render()}
function openEmergency(id){
  const existing=id?(state.emergency||[]).find(x=>String(x.id)===String(id)):null;
  fieldsModal(
    existing?'비상금 내역 편집':'비상금 내역',
    [
      {label:'날짜',name:'date',type:'date',value:existing?.date||iso(today),required:true},
      {label:'금액',name:'amount',type:'number',step:'any',value:existing?.amount??'',required:true},
      {label:'내용',name:'memo',value:existing?.memo||''}
    ],
    d=>{
      const kindVal=String(d.kind||'').trim()==='출금'?'출금':'입금';
      const amtVal=+d.amount||0;
      if(!Array.isArray(state.emergency))state.emergency=[];
      if(existing){
        const idx=state.emergency.findIndex(x=>String(x.id)===String(existing.id));
        const updated={...existing,date:d.date,kind:kindVal,amount:amtVal,memo:String(d.memo||'').trim()};
        if(idx>=0)state.emergency[idx]=updated;
      }else if(amtVal!==0){
        state.emergency.push({id:'em_'+Date.now(),date:d.date,kind:kindVal,amount:amtVal,memo:String(d.memo||'').trim()});
      }
    },
    {
      name:'kind',
      label:'구분',
      options:['입금','출금'],
      value:existing?.kind==='출금'?'출금':'입금'
    }
  );
}
function deleteEmergency(id){
  if(confirm('이 비상금 내역을 삭제할까요?')){
    state.emergency=(state.emergency||[]).filter(x=>String(x.id)!==String(id));
    save();
    render();
  }
}

function exportBackup(){
  const backup={...state,_backupMeta:{app:'머니플래너',version:2,createdAt:new Date().toISOString()}};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='머니플래너_백업.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function triggerImport(){
  const input=$('importFileInput');
  if(!input){alert('파일 선택 기능을 찾을 수 없습니다.');return;}
  input.value='';
  try{input.click();}catch(err){alert('파일 선택창을 열 수 없습니다. '+err.message);}
}

function importTransactionRows(rows){
  if(!Array.isArray(rows))return [];
  const pick=(o,keys)=>{for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&String(o[k]).trim()!=='')return o[k];}return '';};
  return rows.filter(r=>r&&typeof r==='object').map((r,i)=>{
    const rawDate=pick(r,['date','날짜','거래일','일자','거래일자','transactionDate']);
    const rawAmount=pick(r,['amount','금액','거래금액','입출금액','value']);
    const rawType=String(pick(r,['type','구분','거래구분','수입지출','입출금구분'])||'지출').trim();
    const type=(rawType.includes('수입')||rawType.includes('입금'))?'수입':(rawType.includes('이체')?'이체':'지출');
    const amount=Number(String(rawAmount).replace(/[₩원,\s]/g,''));
    if(!rawDate||!Number.isFinite(amount)||amount<=0)return null;
    return {
      id:String(pick(r,['id','거래ID','번호'])||('imp_'+Date.now()+'_'+i)),
      date:normalizeDateString(rawDate), amount:Math.abs(amount), type,
      account:String(pick(r,['account','계좌','결제수단','은행','카드'])||'').trim(),
      category:String(pick(r,['category','항목','분류','카테고리'])||(type==='수입'?'기타수입':'기타비')).trim(),
      item:String(pick(r,['item','세부항목','내용','거래내용','내역','상세내용'])||'').trim(),
      memo:String(pick(r,['memo','메모','비고','적요'])||'').trim()
    };
  }).filter(Boolean);
}

function handleImportFile(event){
  const file=event.target.files && event.target.files[0];
  if(!file)return;
  const lowerName=file.name.toLowerCase();
  const reader=new FileReader();
  reader.onerror=()=>alert('파일을 읽지 못했습니다. 파일이 손상되었거나 접근 권한이 없을 수 있습니다.');
  reader.onload=e=>{
    try{
      let parsed;
      if(lowerName.endsWith('.csv') || file.type==='text/csv'){
        const lines=String(e.target.result||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
        if(lines.length<2){alert('CSV 파일에 불러올 거래내역이 없습니다.');return;}
        const parseLine=line=>{const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'&&quoted){cur+='"';i++;}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){out.push(cur);cur='';}else cur+=c;}out.push(cur);return out;};
        const headers=parseLine(lines[0]).map(x=>x.trim());
        parsed={transactions:lines.slice(1).map(line=>{const vals=parseLine(line);return Object.fromEntries(headers.map((h,i)=>[h,vals[i]??'']));})};
      }else{
        parsed=JSON.parse(e.target.result);
      }
      if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)){alert('올바른 JSON/CSV 백업 파일 형식이 아닙니다.');return;}
      let source=parsed;
      for(const key of ['state','data','payload','backup']){
        if(source[key]&&typeof source[key]==='object'&&!Array.isArray(source[key])){source=source[key];break;}
      }
      const rows=source.transactions||source.transaction||source.ledger||source.records||source['거래내역']||source['거래 내역']||source['거래'];
      if(Array.isArray(rows)){
        const mapped=importTransactionRows(rows);
        if(mapped.length){
          source={...source,transactions:mapped};
        }else if(!Array.isArray(source.transactions)){
          alert('파일은 읽었지만 거래내역의 날짜·금액을 인식하지 못했습니다.');return;
        }
      }
      const knownKeys=['transactions','assets','debts','emergency','savings','income','expense','accounts','accountInitials','cardBankLinks','categoryItems','fixedExpenses','budget','dayQuickDraft','_backupMeta'];
      const hasKnownKey=knownKeys.some(k=>Object.prototype.hasOwnProperty.call(source,k));
      if(!hasKnownKey){alert('가계부 데이터가 포함된 JSON/CSV 파일이 아닙니다.');return;}
      const nextState=normalizeStateData(source);
      const currTxCount=state.transactions.length;
      if(currTxCount>0&&nextState.transactions.length===0){if(!confirm(`불러올 파일에 거래 내역이 0건입니다. 기존 거래 ${currTxCount}건이 덮어씌워질 수 있는데 진행할까요?`))return;}
      saveSnapshotBeforeImport();
      state=nextState;
      save();
      initSelects();
      if(state.transactions.length>0){
        const sortedTxs=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));
        const latestDate=sortedTxs[0].date||'';
        const ly=Number(latestDate.slice(0,4));
        const lm=Number(latestDate.slice(5,7));
        if(ly && $('filterYear'))$('filterYear').value=String(ly);
        if(lm && $('filterMonth'))$('filterMonth').value=String(lm);
        if(ly && $('monthlyYear'))$('monthlyYear').value=String(ly);
        if(lm && $('monthlyMonth'))$('monthlyMonth').value=String(lm);
        if(ly && $('yearlyYear'))$('yearlyYear').value=String(ly);
        if(ly)calendarYear=ly;
        if(lm)calendarMonth=lm;
      }
      render();
      alert(`데이터를 성공적으로 불러왔습니다. (거래 ${state.transactions.length}건)`);
    }catch(err){alert('파일 불러오기 중 오류가 발생했습니다: '+err.message);}
  };
  reader.readAsText(file,'utf-8');
}

function initDraggableFab(){
  const fab=$('fabAddBtn');
  if(!fab)return;
  const STORAGE_KEY='chokobi_fab_pos_v1';
  let activePointerId=null;
  let startX=0,startY=0,startLeft=0,startTop=0;
  let moved=false;

  const clampPos=(left,top)=>{
    const w=fab.offsetWidth||52;
    const h=fab.offsetHeight||52;
    const pad=10;
    const maxLeft=Math.max(pad,window.innerWidth-w-pad);
    const maxTop=Math.max(pad,window.innerHeight-h-pad);
    return {
      left:Math.min(Math.max(pad,left),maxLeft),
      top:Math.min(Math.max(pad,top),maxTop)
    };
  };

  const applySavedPos=()=>{
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw)return;
      const pos=JSON.parse(raw);
      if(typeof pos?.left==='number' && typeof pos?.top==='number'){
        const clamped=clampPos(pos.left,pos.top);
        fab.style.left=clamped.left+'px';
        fab.style.top=clamped.top+'px';
        fab.style.right='auto';
        fab.style.bottom='auto';
      }
    }catch(_e){}
  };

  applySavedPos();

  window.addEventListener('resize',()=>{
    if(!fab.style.left || !fab.style.top)return;
    const curLeft=parseFloat(fab.style.left);
    const curTop=parseFloat(fab.style.top);
    if(Number.isFinite(curLeft) && Number.isFinite(curTop)){
      const clamped=clampPos(curLeft,curTop);
      fab.style.left=clamped.left+'px';
      fab.style.top=clamped.top+'px';
    }
  });

  fab.addEventListener('pointerdown',e=>{
    if(e.button!==0 && e.pointerType==='mouse')return;
    activePointerId=e.pointerId;
    const rect=fab.getBoundingClientRect();
    startX=e.clientX;
    startY=e.clientY;
    startLeft=rect.left;
    startTop=rect.top;
    moved=false;
    fab.classList.add('dragging');
    try{fab.setPointerCapture(e.pointerId);}catch(_e){}
  });

  fab.addEventListener('pointermove',e=>{
    if(e.pointerId!==activePointerId)return;
    const dx=e.clientX-startX;
    const dy=e.clientY-startY;
    if(!moved && Math.hypot(dx,dy)>6)moved=true;
    if(!moved)return;
    const clamped=clampPos(startLeft+dx,startTop+dy);
    fab.style.left=clamped.left+'px';
    fab.style.top=clamped.top+'px';
    fab.style.right='auto';
    fab.style.bottom='auto';
  });

  const finishDrag=e=>{
    if(e.pointerId!==activePointerId)return;
    activePointerId=null;
    fab.classList.remove('dragging');
    try{fab.releasePointerCapture(e.pointerId);}catch(_e){}
    if(moved){
      const rect=fab.getBoundingClientRect();
      try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify({left:rect.left,top:rect.top}));
      }catch(_e){}
      fab.dataset.suppressClick='1';
      setTimeout(()=>{delete fab.dataset.suppressClick;},60);
    }
  };

  fab.addEventListener('pointerup',finishDrag);
  fab.addEventListener('pointercancel',finishDrag);

  fab.addEventListener('click',()=>{
    if(fab.dataset.suppressClick)return;
    openTx();
  });
}

function init() {
  initDraggableFab();
  updateRestoreSnapshotBtn();
  page(getSavedPageName());
}
init();
